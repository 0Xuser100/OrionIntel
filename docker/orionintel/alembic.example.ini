# Alembic config used INSIDE the deploy container.
#
# Copy this to alembic.ini (same folder) before building:
#     cp alembic.example.ini alembic.ini
#
# The only line that differs from src/ is `sqlalchemy.url` below: it points at
# the compose service `pgvector` on the INTERNAL port 5432 (not localhost:5433),
# and uses the psycopg2 (sync) driver because Alembic runs synchronously.
#
# The credentials + db name MUST match ./env/.env.postgres and ./env/.env.app.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# host = pgvector (compose service), port = 5432 (internal), driver = psycopg2
# NOTE: if your password contains "@", url-encode it as %%40 (double % for configparser).
sqlalchemy.url = postgresql+psycopg2://orionintel:orionintel_pass@pgvector:5432/orionintel


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
