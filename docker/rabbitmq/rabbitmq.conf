# RabbitMQ node configuration (mounted at /etc/rabbitmq/rabbitmq.conf).
# This is the "sysctl style" format RabbitMQ >= 3.7 uses.

# --- Memory management ---
# Block publishers once the node uses 60% of the machine's RAM. Prevents the
# broker from being OOM-killed while a big backlog builds up.
vm_memory_high_watermark.relative = 0.6

# --- Disk space management ---
# Same idea for disk: stop accepting messages with less than 2 GB free.
disk_free_limit.absolute = 2GB

# --- SSL/TLS ---
# We speak plain AMQP inside the compose `backend` network, so no peer
# verification. Do NOT keep this if you ever expose 5672 to the internet.
ssl_options.verify = verify_none

# --- Management plugin (web UI) ---
management.tcp.port = 15672

# --- Logging ---
# Log to the container's stdout so `docker compose logs rabbitmq` works.
log.file.level = info
log.console = true
log.console.level = info
