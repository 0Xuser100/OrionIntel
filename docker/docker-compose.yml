services:
  # ── FastAPI Application (OrionIntel) ───────────────────────────────
  fastapi:
    build:
      context: ..                              # repo root, so it can copy src/ AND docker/orionintel/
      dockerfile: docker/orionintel/Dockerfile
    container_name: orionintel_fastapi
    ports:
      - "8000:8000"
    volumes:
      - fastapi_data:/app/assets               # persist uploaded files
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy             # wait until Postgres accepts connections
      qdrant:
        condition: service_started
    env_file:
      - ./env/.env.app

  # ── Nginx reverse proxy ────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: orionintel_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always

  # ── PostgreSQL + pgvector (relational DB: projects / assets / chunks) ─
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: orionintel_pgvector
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      # $$ escapes to a single $ so the shell (not compose) expands the var inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Qdrant vector database ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: orionintel_qdrant
    ports:
      - "6333:6333"                            # REST + dashboard + /metrics
      - "6334:6334"                            # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always

  # ── Prometheus — scrapes & stores metrics ──────────────────────────
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: orionintel_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # ── Grafana — dashboards on top of Prometheus ──────────────────────
  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    container_name: orionintel_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

  # ── Node exporter — host CPU / RAM / disk metrics ──────────────────
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: orionintel_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend
    restart: always

  # ── Postgres exporter — turns Postgres internals into metrics ──────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: orionintel_postgres_exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge

volumes:
  fastapi_data:
  pgvector_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
