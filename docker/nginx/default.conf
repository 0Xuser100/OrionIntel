server {
    listen 80;
    server_name localhost;

    # Proxy everything to the FastAPI app (service name "fastapi" on the backend network)
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics endpoint (obscure path). Prometheus scrapes fastapi:8000 directly on
    # the internal network, so this is only for optional manual inspection via :80.
    location /TrhBVe_m5gg2002_E5VVqS {
        proxy_pass http://fastapi:8000/TrhBVe_m5gg2002_E5VVqS;
    }
}
