server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS server. nginx resolves a hostname written directly in
    # `proxy_pass` ONCE, at startup — so after `docker compose up -d --build
    # fastapi` (new container, new IP) nginx keeps dialling the dead address and
    # returns 502 until you restart it. Supplying the upstream through a variable
    # makes nginx use the resolver instead, re-resolving every `valid=` seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fastapi_upstream http://fastapi:8000;

    # Proxy everything to the FastAPI app (service name "fastapi" on the backend
    # network). With a variable upstream and no URI part, nginx forwards the
    # original request URI unchanged.
    location / {
        proxy_pass $fastapi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics endpoint (obscure path). Prometheus scrapes fastapi:8000 directly on
    # the internal network, so this is only for optional manual inspection via :80.
    location /TrhBVe_m5gg2002_E5VVqS {
        proxy_pass $fastapi_upstream;
    }
}
